<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ujian CBT • Pilihan Ganda (A–E) • 10 Menit</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --border: #cbd5e1;
      --active-bg: #eff6ff;
      --answered-bg: #dbeafe;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #15803d;
      --success-bg: #f0fdf4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    :fullscreen,
    ::backdrop {
      width: 100vw;
      min-height: 100vh;
      background: var(--bg);
      overflow-y: auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .timer-box {
      font-weight: 700;
      font-size: 1rem;
      padding: 8px 14px;
      border-radius: 8px;
      background: #e2e8f0;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .timer-box.warning {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .app-container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 24px 36px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .login-card {
      max-width: 520px;
      margin: 32px auto;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label.field-label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--text);
      background: #fff;
    }

    input:focus {
      outline: 2px solid rgba(29, 78, 216, 0.25);
      border-color: var(--primary);
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #cbd5e1;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-success:hover:not(:disabled) {
      background: #166534;
    }

    .btn-full {
      width: 100%;
      padding: 12px 18px;
    }

    .alert {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.92rem;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .exam-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .exam-grid {
        grid-template-columns: 1fr;
      }

      .app-container {
        padding: 14px;
      }

      .card {
        padding: 18px;
      }
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .q-text {
      font-size: 1.1rem;
      line-height: 1.65;
      margin-bottom: 16px;
      white-space: pre-line;
    }

    /* Ukuran gambar soal pada tampilan normal */
    img,
    .q-image,
    .soal-img {
      display: block;
      max-width: 100%;
      max-height: 360px;
      width: auto;
      height: auto;
      margin: 12px auto 18px;
      object-fit: contain;
      border-radius: 8px;
    }

    /* Penyesuaian ukuran gambar saat masuk mode layar penuh */
    :fullscreen img,
    :fullscreen .q-image,
    :fullscreen .soal-img,
    :-webkit-full-screen img,
    :-webkit-full-screen .q-image,
    :-webkit-full-screen .soal-img {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      max-width: 90% !important;
      max-height: 55vh !important;
      width: auto !important;
      height: auto !important;
      margin: 12px auto 18px !important;
      object-fit: contain !important;
      position: relative;
      z-index: 5;
    }

    @media (max-width: 640px) {
      img,
      .q-image,
      .soal-img,
      :fullscreen img,
      :fullscreen .q-image,
      :fullscreen .soal-img,
      :-webkit-full-screen img,
      :-webkit-full-screen .q-image,
      :-webkit-full-screen .soal-img {
        max-width: 100% !important;
        max-height: 38vh !important;
      }
    }

    .options-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      line-height: 1.5;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .option:hover {
      border-color: var(--primary);
      background: #f8fafc;
    }

    .option.active {
      border-color: var(--primary);
      background: var(--active-bg);
    }

    .option input[type="radio"] {
      margin-top: 3px;
      accent-color: var(--primary);
      transform: scale(1.15);
    }

    .opt-letter {
      font-weight: 700;
      min-width: 22px;
    }

    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }

    .nav-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .num-btn {
      padding: 8px 0;
      font-size: 0.85rem;
      border-radius: 6px;
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .num-btn.answered {
      background: var(--answered-bg);
      border-color: #93c5fd;
    }

    .num-btn.current {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .legend {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .result-box {
      max-width: 600px;
      margin: 24px auto;
      text-align: center;
    }

    .score-display {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--primary);
      margin: 14px 0;
    }

    .result-summary {
      background: var(--success-bg);
      border: 1px solid #bbf7d0;
      color: var(--text);
      border-radius: 10px;
      padding: 16px;
      margin: 18px 0;
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">CBT UJIAN • PILIHAN GANDA (A–E) • 10 MENIT</div>
    <div class="topbar-right">
      <div id="timerBox" class="timer-box hidden">Sisa Waktu: 10:00</div>
      <button id="fullscreenBtn" type="button" class="btn-secondary" onclick="toggleFullscreen()">
        Layar Penuh
      </button>
    </div>
  </header>

  <main class="app-container">
